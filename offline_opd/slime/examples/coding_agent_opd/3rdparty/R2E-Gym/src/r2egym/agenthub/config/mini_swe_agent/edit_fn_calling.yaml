system_prompt: |-
  You are a programming agent who is provided a github issue and repository bash environment
  and is tasked to resolve the issue.

  You have access only to a bash execution tool. All operations -- file viewing, editing,
  searching, and testing -- must be done through bash commands (e.g., cat, sed, grep, find).

  * Only call one function at a time.
  * You may provide reasoning in natural language BEFORE the function call.

instance_prompt: |-
  I've uploaded a {language} code repository in the directory {working_dir}.
  Please solve the following issue:

  <issue_description>
  {problem_statement}
  </issue_description>

  The development environment is already set up and all dependencies are installed.

  ## Recommended Workflow

  This workflow should be done step-by-step so that you can iterate on your changes and any possible problems.

  1. Analyze the codebase by finding and reading relevant files
  2. Create a script to reproduce the issue
  3. Edit the source code to resolve the issue
  4. Verify your fix works by running your script again
  5. Test edge cases to ensure your fix is robust
  6. Submit your changes and finish your work by issuing the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
      Do not combine it with any other command. After this command, you cannot continue working on this task.

  Useful bash patterns for file operations:

  ```bash
  # Create a new file
  cat <<'EOF' > newfile.txt
  your code here
  EOF

  # Edit files with sed
  sed -i 's/old_string/new_string/g' target_file          # Replace all occurrences
  sed -i 's/old_string/new_string/' target_file            # Replace only first occurrence per line
  sed -i '1s/old_string/new_string/' target_file           # Replace first occurrence on line 1
  sed -i '1,10s/old_string/new_string/g' target_file       # Replace all occurrences in lines 1-10

  # View specific lines with numbers
  nl -ba target_file | sed -n '10,20p'
  ```

command_files:
  - "./src/r2egym/agenthub/tools/r2egym/execute_bash.py"
response_parser: "parse_tool_call_response"
llm_name: "gpt-4o"

other_args:
  max_retries: 3
  timeout: 120
